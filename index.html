<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Roof Research Tool</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --navy:#0B1F3A;--navy2:#122848;--navy3:#1A3558;
    --teal:#1D9E75;--teal2:#0F6E56;--teal-light:#E1F5EE;
    --water:#378ADD;--water-light:#E6F1FB;
    --sand:#F5F3EE;--white:#FFFFFF;
    --muted:#6B7C93;--border:#D6E4F0;
    --amber:#BA7517;--amber-light:#FAEEDA;
    --coral:#D85A30;--coral-light:#FAECE7;
    --green:#3B6D11;--green-light:#EAF3DE;
    --pink:#993556;--pink-light:#FBEAF0;
    --purple:#534AB7;--purple-light:#EEEDFE;
  }
  body{font-family:"Anthropic Sans",system-ui,sans-serif;background:var(--sand);color:var(--navy);min-height:100vh}

  .shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}

  /* Sidebar */
  .sidebar{background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:0}
  .sidebar-header{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,0.08)}
  .sidebar-logo{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:500;margin-bottom:6px}
  .sidebar-title{font-size:17px;font-weight:500;line-height:1.3;color:#fff}
  .sidebar-sub{font-size:12px;color:rgba(255,255,255,0.45);margin-top:4px}

  .pipeline{padding:16px 0;flex:1;overflow-y:auto}
  .pipe-stage{display:flex;align-items:flex-start;gap:0;padding:0 16px;cursor:pointer;position:relative}
  .pipe-stage:hover .stage-label{color:#fff}
  .pipe-spine{display:flex;flex-direction:column;align-items:center;width:32px;flex-shrink:0}
  .pipe-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);background:transparent;transition:all .25s;flex-shrink:0;margin-top:11px}
  .pipe-dot.done{background:var(--teal);border-color:var(--teal)}
  .pipe-dot.active{background:#fff;border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,0.15)}
  .pipe-dot.new-badge{background:var(--pink);border-color:var(--pink)}
  .pipe-line{width:2px;background:rgba(255,255,255,0.1);flex:1;min-height:8px;transition:background .25s}
  .pipe-line.done{background:var(--teal)}
  .stage-content{flex:1;padding:8px 0 8px 10px}
  .stage-num{font-size:10px;color:rgba(255,255,255,0.3);font-weight:500;letter-spacing:.06em;margin-bottom:2px}
  .stage-label{font-size:13px;color:rgba(255,255,255,0.6);font-weight:400;transition:color .2s;line-height:1.3}
  .stage-label.active{color:#fff;font-weight:500}
  .stage-label.done{color:rgba(255,255,255,0.75)}
  .new-pill{display:inline-block;font-size:9px;background:var(--pink);color:#fff;padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:middle;letter-spacing:.04em;font-weight:500}

  .sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.08)}
  .session-label{font-size:11px;color:rgba(255,255,255,0.3);margin-bottom:6px}
  .session-name{font-size:12px;color:rgba(255,255,255,0.6)}

  /* Main */
  .main{display:flex;flex-direction:column;overflow:hidden}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .topbar-stage{font-size:13px;color:var(--muted)}
  .topbar-stage strong{color:var(--navy);font-weight:500}
  .progress-wrap{display:flex;align-items:center;gap:10px}
  .progress-bar{width:140px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
  .progress-fill{height:100%;background:var(--teal);border-radius:3px;transition:width .4s ease}
  .progress-label{font-size:12px;color:var(--muted)}

  .content{flex:1;overflow-y:auto;padding:28px}

  /* Stage panels */
  .stage-panel{display:none}
  .stage-panel.active{display:block}
  .panel-header{margin-bottom:24px}
  .panel-eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal2);font-weight:500;margin-bottom:6px}
  .panel-title{font-size:22px;font-weight:500;color:var(--navy);line-height:1.2}
  .panel-desc{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.6;max-width:600px}

  /* Cards */
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
  .card-title{font-size:13px;font-weight:500;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .card-title i{color:var(--teal);font-size:16px}

  /* Charts */
  .chart-wrap{position:relative;height:260px;margin-top:14px}

  /* Input areas */
  .input-area{width:100%;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:13px;font-family:inherit;color:var(--navy);background:#fff;resize:vertical;min-height:100px;outline:none;transition:border-color .2s}
  .input-area:focus{border-color:var(--teal)}
  .input-label{font-size:12px;font-weight:500;color:var(--navy2);margin-bottom:6px;display:block}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;padding:9px 18px;border-radius:8px;border:none;cursor:pointer;transition:all .18s;font-family:inherit}
  .btn-primary{background:var(--teal);color:#fff}
  .btn-primary:hover{background:var(--teal2)}
  .btn-secondary{background:#fff;color:var(--navy);border:1px solid var(--border)}
  .btn-secondary:hover{border-color:var(--teal);color:var(--teal2)}
  .btn-row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}

  /* Output box */
  .output-box{background:var(--sand);border:1px solid var(--border);border-radius:8px;padding:14px 16px;font-size:13px;line-height:1.7;color:var(--navy2);min-height:60px;white-space:pre-wrap}
  .output-box.empty{color:var(--muted);font-style:italic}

  /* Stat row */
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-align:center}
  .stat-val{font-size:22px;font-weight:500;color:var(--navy)}
  .stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}

  /* Journal table */
  .journal-table{width:100%;border-collapse:collapse;font-size:13px}
  .journal-table th{text-align:left;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--border)}
  .journal-table td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  .journal-table tr:last-child td{border-bottom:none}
  .journal-table tr:hover td{background:var(--sand)}
  .score-bar-wrap{display:flex;align-items:center;gap:8px}
  .score-bar{height:6px;border-radius:3px;background:var(--teal)}
  .fit-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
  .fit-high{background:var(--green-light);color:var(--green)}
  .fit-med{background:var(--amber-light);color:var(--amber)}
  .fit-low{background:var(--coral-light);color:var(--coral)}
  .warn-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;background:var(--coral-light);color:var(--coral);font-weight:500}
  .ok-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;background:var(--green-light);color:var(--green);font-weight:500}

  /* Citation check */
  .citation-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
  .citation-row:last-child{border-bottom:none}
  .ci{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-size:11px}
  .ci-ok{background:var(--green-light);color:var(--green)}
  .ci-warn{background:var(--amber-light);color:var(--amber)}
  .ci-text{font-size:13px;color:var(--navy2);line-height:1.5}
  .ci-meta{font-size:11px;color:var(--muted);margin-top:2px}

  /* Loader dot */
  .loader{display:inline-flex;gap:4px;align-items:center}
  .loader span{width:5px;height:5px;border-radius:50%;background:var(--teal);animation:ld .8s ease-in-out infinite}
  .loader span:nth-child(2){animation-delay:.15s}
  .loader span:nth-child(3){animation-delay:.3s}
  @keyframes ld{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

  /* Tag */
  .tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:5px;margin:2px;background:var(--water-light);color:var(--water);font-weight:400}

  /* Toggle row */
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
  .toggle-row:last-child{border-bottom:none}
  .toggle-info{font-size:13px;color:var(--navy2)}
  .toggle-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .toggle{position:relative;width:34px;height:19px;flex-shrink:0}
  .toggle input{opacity:0;width:0;height:0;position:absolute}
  .toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:10px;cursor:pointer;transition:.2s}
  .toggle input:checked+.toggle-slider{background:var(--teal)}
  .toggle-slider:before{content:"";position:absolute;width:13px;height:13px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .toggle input:checked+.toggle-slider:before{transform:translateX(15px)}

  /* Divider */
  .divider{height:1px;background:var(--border);margin:20px 0}

  .run-all-btn{background:var(--navy);color:#fff;font-size:13px;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit;font-weight:500;transition:background .2s}
  .run-all-btn:hover{background:var(--navy3)}

  .next-btn{background:var(--teal);color:#fff;padding:10px 22px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:7px;font-family:inherit;transition:background .2s}
  .next-btn:hover{background:var(--teal2)}
</style>
</head>
<body>
<div class="shell">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">Research AI</div>
      <div class="sidebar-title">Blue Roof<br>Research Tool</div>
      <div class="sidebar-sub">Environmental Science</div>
    </div>
    <nav class="pipeline" id="pipeline-nav"></nav>
    <div class="sidebar-footer">
      <div class="session-label">Current session</div>
      <div class="session-name">Storm event study — May 2026</div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-stage" id="topbar-label"><strong>Stage 1</strong> &mdash; Lab data ingestion</div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <span class="progress-label" id="progress-label">0 / 9</span>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
const STAGES = [
  {
    id:'ingest', num:'01', label:'Lab data ingestion',
    color:'teal', eyebrow:'Stage 1 of 9',
    desc:'Upload raw sensor outputs from your blue roof instrumentation. The tool validates units, detects outliers, and normalises across measurement points.',
    panel:'ingest'
  },
  {
    id:'lit', num:'02', label:'Literature review',
    color:'blue', eyebrow:'Stage 2 of 9',
    desc:'Automated search across Scopus, Web of Science, and Google Scholar. Screens abstracts for relevance to your study parameters and builds a citation map.',
    panel:'lit'
  },
  {
    id:'stats', num:'03', label:'Statistical analysis',
    color:'purple', eyebrow:'Stage 3 of 9',
    desc:'Domain-specific functions for blue roof hydrology: runoff coefficient, peak flow attenuation, water retention volume, and pollutant load reduction.',
    panel:'stats'
  },
  {
    id:'context', num:'04', label:'Contextualisation',
    color:'amber', eyebrow:'Stage 4 of 9',
    desc:'Compares your results to published benchmarks and identifies where your findings diverge. Surfaces candidate explanations for the discussion section.',
    panel:'context'
  },
  {
    id:'draft', num:'05', label:'Paper drafting',
    color:'coral', eyebrow:'Stage 5 of 9',
    desc:'Generates each section independently. Methods and Results are written from data; Discussion draws on the contextualisation layer. References are auto-formatted.',
    panel:'draft'
  },
  {
    id:'viz', num:'06', label:'Visualisation',
    color:'green', eyebrow:'Stage 6 of 9',
    desc:'Produces publication-ready figures: hydrographs, retention heatmaps, and comparison tables. All outputs are exported at 300 dpi.',
    panel:'viz'
  },
  {
    id:'qa', num:'07', label:'Quality assurance',
    color:'gray', eyebrow:'Stage 7 of 9',
    desc:'Audits every claim in the discussion against your data and cited literature. Flags unsupported assertions and verifies data traceability before submission.',
    panel:'qa'
  },
  {
    id:'journal', num:'08', label:'Journal suggestion', isNew:true,
    color:'pink', eyebrow:'Stage 8 of 9',
    desc:'Scores the manuscript against journal scope, impact factor, and open-access requirements. Flags predatory publishers and estimates acceptance probability.',
    panel:'journal'
  },
  {
    id:'prep', num:'09', label:'Journal preparation',
    color:'teal', eyebrow:'Stage 9 of 9',
    desc:'Reformats the manuscript to the target journal\'s style guide, generates the cover letter, and compiles the supplementary data package.',
    panel:'prep'
  }
];

let currentStage = 0;
let completedStages = new Set();
let pipelineData = {};
let hydroChart = null;
let scatterChart = null;

function buildSidebar(){
  const nav = document.getElementById('pipeline-nav');
  nav.innerHTML = STAGES.map((s,i)=>`
    <div class="pipe-stage" onclick="goToStage(${i})" id="nav-stage-${i}">
      <div class="pipe-spine">
        <div class="pipe-dot ${s.isNew?'new-badge':''}" id="dot-${i}"></div>
        ${i<STAGES.length-1?`<div class="pipe-line" id="line-${i}"></div>`:''}
      </div>
      <div class="stage-content">
        <div class="stage-num">${s.num}</div>
        <div class="stage-label" id="slabel-${i}">${s.label}${s.isNew?'<span class="new-pill">NEW</span>':''}</div>
      </div>
    </div>
  `).join('');
}

function buildContent(){
  const c = document.getElementById('content');
  c.innerHTML = `
    ${panelIngest()}
    ${panelLit()}
    ${panelStats()}
    ${panelContext()}
    ${panelDraft()}
    ${panelViz()}
    ${panelQA()}
    ${panelJournal()}
    ${panelPrep()}
  `;
}

function panelIngest(){return `<div class="stage-panel" id="panel-0">
  <div class="panel-header">
    <div class="panel-eyebrow">Stage 1 of 9 &mdash; Lab data ingestion</div>
    <div class="panel-title">Upload lab results</div>
    <div class="panel-desc">Paste raw sensor data from your blue roof monitoring rig as CSV. The tool parses it, flags outliers using the IQR method, and reports the channels it detected.</div>
  </div>
  <div class="card">
    <div class="card-title"><i class="ti ti-upload" aria-hidden="true"></i> Raw sensor data</div>
    <label class="input-label">CSV data (edit the sample below or paste your own)</label>
    <textarea class="input-area" id="lab-input" rows="6">timestamp, rainfall_mm, outflow_L/s, retention_%, temp_C
2026-05-14 09:00, 12.4, 0.82, 93.4, 18.2
2026-05-14 09:15, 14.1, 0.91, 92.8, 18.4
2026-05-14 09:30, 18.6, 1.40, 90.1, 18.6
2026-05-14 09:45, 22.3, 4.85, 78.3, 18.9
2026-05-14 10:00, 9.8, 0.65, 94.2, 19.1
2026-05-14 10:15, 6.2, 0.41, 95.5, 19.3
2026-05-14 10:30, 3.1, 0.22, 96.8, 19.4
2026-05-14 10:45, 1.0, 0.08, 98.1, 19.5
2026-05-14 11:00, 0.5, 0.04, 98.6, 19.6
2026-05-14 11:15, 0.2, 0.02, 98.9, 19.7</textarea>
    <div class="btn-row">
      <button class="run-all-btn" onclick="runIngestion()">
        <i class="ti ti-player-play" aria-hidden="true"></i> Parse and validate data
      </button>
    </div>
  </div>
  <div class="card" id="output-card-0" style="display:none">
    <div class="card-title"><i class="ti ti-check" aria-hidden="true"></i> Ingestion results</div>
    <div class="stat-row" id="ingest-stats"></div>
    <div class="output-box" id="ingest-output"></div>
  </div>
  <div class="btn-row"><button class="next-btn" onclick="completeAndNext(0)"><i class="ti ti-arrow-right" aria-hidden="true"></i> Next: literature review</button></div>
</div>`;}

function panelLit(){return `<div class="stage-panel" id="panel-1">
  <div class="panel-header">
    <div class="panel-eyebrow">Stage 2 of 9 &mdash; Literature review</div>
    <div class="panel-title">Literature search</div>
    <div class="panel-desc">Define your study parameters and the tool will query Scopus, Web of Science, and Google Scholar. Abstract screening filters to relevant papers, and citation mapping reveals the key studies you must position against.</div>
  </div>
  <div class="card">
    <div class="card-title"><i class="ti ti-search" aria-hidden="true"></i> Search parameters</div>
    <label class="input-label">Key topics</label>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
      <span class="tag">blue roof</span><span class="tag">stormwater retention</span><span class="tag">urban hydrology</span><span class="tag">peak flow attenuation</span><span class="tag">green-blue hybrid</span><span class="tag">water balance</span>
    </div>
    <label class="input-label">Publication year range</label>
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <input type="number" value="2015" style="width:90px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;color:var(--navy)">
      <span style="align-self:center;color:var(--muted)">to</span>
      <input type="number" value="2026" style="width:90px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;color:var(--navy)">
    </div>
    <div class="btn-row">
      <button class="run-all-btn" onclick="simulateRun(1, this)">
        <i class="ti ti-player-play" aria-hidden="true"></i> Run literature review
      </button>
    </div>
  </div>
  <div class="card" id="output-card-1" style="display:none">
    <div class="card-title"><i class="ti ti-check" aria-hidden="true"></i> Literature results</div>
    <div class="stat-row">
      <div class="stat-card"><div class="stat-val">312</div><div class="stat-lbl">Papers found</div></div>
      <div class="stat-card"><div class="stat-val">47</div><div class="stat-lbl">Passed screening</div></div>
      <div class="stat-card"><div class="stat-val">12</div><div class="stat-lbl">Core citations</div></div>
    </div>
    <div class="output-box">312 papers retrieved. After abstract screening, 47 are relevant to blue roof retention performance.
Key benchmark studies identified: Stovin et al. (2017), Shafique et al. (2018), Johannessen et al. (2019).
Citation map built. Your study must position against: median retention 78–91% in temperate climates.
Ready to run statistical analysis against these benchmarks.</div>
  </div>
  <div class="btn-row"><button class="next-btn" onclick="completeAndNext(1)"><i class="ti ti-arrow-right" aria-hidden="true"></i> Next: statistical analysis</button></div>
</div>`;}

function panelStats(){return `<div class="stage-panel" id="panel-2">
  <div class="panel-header">
    <div class="panel-eyebrow">Stage 3 of 9 &mdash; Statistical analysis</div>
    <div class="panel-title">Run analysis</div>
    <div class="panel-desc">Computes hydrological metrics directly from the data you ingested in Stage 1. Metrics that need a reference dataset not present in your input are reported as unavailable rather than guessed.</div>
  </div>
  <div class="card">
    <div class="card-title"><i class="ti ti-settings" aria-hidden="true"></i> Analysis settings</div>
    <div class="toggle-row">
      <div><div class="toggle-info">Runoff coefficient (Cr)</div><div class="toggle-sub">Approximated as 1 - mean retention rate</div></div>
      <label class="toggle"><input type="checkbox" id="cr-toggle" checked><span class="toggle-slider"></span></label>
    </div>
    <div class="toggle-row">
      <div><div class="toggle-info">Peak flow attenuation</div><div class="toggle-sub">Reduction in peak discharge vs. conventional roof</div></div>
      <label class="toggle"><input type="checkbox" id="peak-toggle" checked><span class="toggle-slider"></span></label>
    </div>
    <div class="toggle-row">
      <div><div class="toggle-info">Water retention rate</div><div class="toggle-sub">Mean retention across all rows</div></div>
      <label class="toggle"><input type="checkbox" id="retention-toggle" checked><span class="toggle-slider"></span></label>
    </div>
    <div class="toggle-row">
      <div><div class="toggle-info">Pollutant load reduction</div><div class="toggle-sub">TSS, TN, TP removal rates</div></div>
      <label class="toggle"><input type="checkbox" id="pollutant-toggle"><span class="toggle-slider"></span></label>
    </div>
    <div class="btn-row">
      <button class="run-all-btn" onclick="runAnalysis()">
        <i class="ti ti-player-play" aria-hidden="true"></i> Run analysis
      </button>
    </div>
  </div>
  <div class="card" id="output-card-2" style="display:none">
    <div class="card-title"><i class="ti ti-chart-bar" aria-hidden="true"></i> Analysis results</div>
    <div class="stat-row" id="stats-stats"></div>
    <div class="output-box" id="stats-output"></div>
  </div>
  <div class="btn-row"><button class="next-btn" onclick="completeAndNext(2)"><i class="ti ti-arrow-right" aria-hidden="true"></i> Next: contextualisation</button></div>
</div>`;}

function panelContext(){return `<div class="stage-panel" id="panel-3">
  <div class="panel-header">
    <div class="panel-eyebrow">Stage 4 of 9 &mdash; Contextualisation</div>
    <div class="panel-title">Compare and interpret</div>
    <div class="panel-desc">Your results are compared against the benchmarks identified in the literature review. The tool flags where your findings diverge and generates candidate explanations for the discussion.</div>
  </div>
  <div class="card">

function parseCSV(text){
  const lines = text.trim().split('\n').map(l=>l.trim()).filter(l=>l.length);
  if(lines.length < 2) return null;
  const headers = lines[0].split(',').map(h=>h.trim());
  const rows = lines.slice(1).map(line=>{
    const cells = line.split(',').map(c=>c.trim());
    const row = {};
    headers.forEach((h,i)=>{
      const raw = cells[i] === undefined ? '' : cells[i];
      const num = Number(raw);
      row[h] = (raw !== '' && !isNaN(num)) ? num : raw;
    });
    return row;
  });
  return {headers, rows};
}

function findColumn(headers, keyword){
  return headers.find(h=>h.toLowerCase().includes(keyword.toLowerCase()));
}

function mean(arr){
  return arr.reduce((a,b)=>a+b, 0) / arr.length;
}

function quantile(sorted, q){
  const pos = (sorted.length - 1) * q;
  const base = Math.floor(pos);
  const rest = pos - base;
  return sorted[base+1] !== undefined ? sorted[base] + rest*(sorted[base+1]-sorted[base]) : sorted[base];
}

function detectOutliers(values){
  const sorted = [...values].sort((a,b)=>a-b);
  const q1 = quantile(sorted, 0.25);
  const q3 = quantile(sorted, 0.75);
  const iqr = q3 - q1;
  const lower = q1 - 1.5*iqr;
  const upper = q3 + 1.5*iqr;
  const outliers = [];
  values.forEach((v,i)=>{ if(v < lower || v > upper) outliers.push(i); });
  return outliers;
}

function linearRegression(xs, ys){
  const n = xs.length;
  const xMean = mean(xs), yMean = mean(ys);
  let num = 0, den = 0;
  for(let i=0;i<n;i++){
    num += (xs[i]-xMean)*(ys[i]-yMean);
    den += (xs[i]-xMean)**2;
  }
  const slope = den === 0 ? 0 : num/den;
  const intercept = yMean - slope*xMean;
  let ssTot = 0, ssRes = 0;
  for(let i=0;i<n;i++){
    const pred = slope*xs[i] + intercept;
    ssRes += (ys[i]-pred)**2;
    ssTot += (ys[i]-yMean)**2;
  }
  const r2 = ssTot === 0 ? 1 : 1 - ssRes/ssTot;
  return {slope, intercept, r2};
}

function runIngestion(){
  const text = document.getElementById('lab-input').value;
  const parsed = parseCSV(text);
  const statsEl = document.getElementById('ingest-stats');
  const outEl = document.getElementById('ingest-output');

  if(!parsed){
    statsEl.innerHTML = '';
    outEl.textContent = 'Could not parse the data. Make sure the first line contains comma-separated column headers, with at least one data row below it.';
    showOutput(0);
    return;
  }

  const {headers, rows} = parsed;
  const numericCols = headers.filter(h => rows.every(r => typeof r[h] === 'number'));
  const outlierRows = new Set();
  const colSummary = numericCols.map(col=>{
    const values = rows.map(r=>r[col]);
    const outlierIdx = detectOutliers(values);
    outlierIdx.forEach(i=>outlierRows.add(i));
    return {col, values, min:Math.min(...values), max:Math.max(...values), mean:mean(values), outlierIdx};
  });

  pipelineData.ingest = {headers, rows, numericCols, colSummary, outlierRows};

  statsEl.innerHTML = `
    <div class="stat-card"><div class="stat-val">${rows.length}</div><div class="stat-lbl">Rows parsed</div></div>
    <div class="stat-card"><div class="stat-val">${numericCols.length}</div><div class="stat-lbl">Numeric channels</div></div>
    <div class="stat-card"><div class="stat-val">${outlierRows.size}</div><div class="stat-lbl">Outlier rows flagged</div></div>
  `;

  const lines = [];
  lines.push(`Detected ${headers.length} columns: ${headers.join(', ')}.`);
  lines.push(`${numericCols.length} numeric channel(s): ${numericCols.length ? numericCols.join(', ') : 'none'}.`);
  colSummary.forEach(s=>{
    lines.push(`${s.col}: min ${s.min}, max ${s.max}, mean ${s.mean.toFixed(2)}.`);
  });
  if(outlierRows.size){
    const labelCol = headers[0];
    const desc = [...outlierRows].sort((a,b)=>a-b).map(i=>`row ${i+1} (${labelCol}=${rows[i][labelCol]})`);
    lines.push(`Outliers (1.5×IQR rule) found in: ${desc.join('; ')}.`);
  } else {
    lines.push('No outliers detected using the 1.5×IQR rule.');
  }
  lines.push('Data is ready for statistical analysis in Stage 3.');
  outEl.textContent = lines.join('\n');

  showOutput(0);
}

function runAnalysis(){
  const statsEl = document.getElementById('stats-stats');
  const outEl = document.getElementById('stats-output');
  const ingest = pipelineData.ingest;

  if(!ingest){
    statsEl.innerHTML = '';
    outEl.textContent = 'No ingested data found. Go to Stage 1 and parse your lab data first.';
    showOutput(2);
    return;
  }

  const {headers, rows} = ingest;
  const rainfallCol = findColumn(headers, 'rainfall');
  const retentionCol = findColumn(headers, 'retention');
  const statCards = [];
  const lines = [];

  if(retentionCol && document.getElementById('retention-toggle').checked){
    const values = rows.map(r=>r[retentionCol]);
    const avgRetention = mean(values);
    statCards.push(`<div class="stat-card"><div class="stat-val">${avgRetention.toFixed(1)}%</div><div class="stat-lbl">Mean retention</div></div>`);
    lines.push(`Mean ${retentionCol} across ${rows.length} rows: ${avgRetention.toFixed(2)}%.`);

    if(document.getElementById('cr-toggle').checked){
      const cr = 1 - avgRetention/100;
      statCards.push(`<div class="stat-card"><div class="stat-val">${cr.toFixed(2)}</div><div class="stat-lbl">Runoff coefficient (Cr)</div></div>`);
      lines.push(`Runoff coefficient Cr = 1 - mean retention = ${cr.toFixed(3)}.`);
    }

    if(rainfallCol && document.getElementById('peak-toggle').checked){
      let peakIdx = 0;
      rows.forEach((r,i)=>{ if(r[rainfallCol] > rows[peakIdx][rainfallCol]) peakIdx = i; });
      const peakRetention = rows[peakIdx][retentionCol];
      statCards.push(`<div class="stat-card"><div class="stat-val">${peakRetention.toFixed(1)}%</div><div class="stat-lbl">Retention at peak rainfall</div></div>`);
      lines.push(`Peak rainfall event was ${rows[peakIdx][rainfallCol]} (${rainfallCol}), retaining ${peakRetention}% (${retentionCol}) at that timestep.`);
    }

    if(rainfallCol){
      const xs = rows.map(r=>r[rainfallCol]);
      const ys = values;
      const {slope, intercept, r2} = linearRegression(xs, ys);
      pipelineData.regression = {xCol:rainfallCol, yCol:retentionCol, slope, intercept, r2};
      lines.push(`Linear regression: ${retentionCol} = ${slope.toFixed(3)} × ${rainfallCol} + ${intercept.toFixed(2)} (R² = ${r2.toFixed(3)}).`);
    }
  } else {
    lines.push('No retention column found in the ingested data — retention, runoff coefficient and peak attenuation could not be computed.');
  }

  if(document.getElementById('pollutant-toggle').checked){
    lines.push('Pollutant load reduction (TSS/TN/TP): not available — the ingested data does not contain pollutant concentration columns.');
  }

  if(ingest.outlierRows.size){
    lines.push(`Note: ${ingest.outlierRows.size} row(s) flagged as outliers in Stage 1 were included in these calculations. Remove them in Stage 1 and re-run if they represent sensor error.`);
  }

  statsEl.innerHTML = statCards.join('');
  outEl.textContent = lines.join('\n');
  showOutput(2);
}

        labels: rows.map(r=>String(r[timeCol])),
        datasets: [
          {label:rainfallCol, data:rows.map(r=>r[rainfallCol]), borderColor:'#2563eb', backgroundColor:'transparent', yAxisID:'y', tension:0.3},
          {label:outflowCol, data:rows.map(r=>r[outflowCol]), borderColor:'#0d9488', backgroundColor:'transparent', yAxisID:'y1', tension:0.3}
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        scales: {
          y: {type:'linear', position:'left', title:{display:true, text:rainfallCol}},
          y1: {type:'linear', position:'right', title:{display:true, text:outflowCol}, grid:{drawOnChartArea:false}}
        }
      }
    });
    lines.push(`Hydrograph plotted: ${rainfallCol} vs ${outflowCol} across ${rows.length} timesteps.`);
  }

  if(document.getElementById('scatter-toggle').checked && rainfallCol && retentionCol){
    scatterCanvas.parentElement.style.display = 'block';
    const points = rows.map(r=>({x:r[rainfallCol], y:r[retentionCol]}));
    const datasets = [{label:`${retentionCol} vs ${rainfallCol}`, data:points, backgroundColor:'#7c3aed'}];
    const reg = pipelineData.regression;
    if(reg){
      const xs = points.map(p=>p.x);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      datasets.push({
        label:'Linear fit', type:'line',
        data:[{x:minX, y:reg.slope*minX+reg.intercept},{x:maxX, y:reg.slope*maxX+reg.intercept}],
        borderColor:'#f97316', backgroundColor:'transparent', pointRadius:0
      });
    }
    scatterChart = new Chart(scatterCanvas, {
      type:'scatter',
      data:{datasets},
      options:{
        responsive:true, maintainAspectRatio:false,
        scales:{
          x:{title:{display:true, text:rainfallCol}},
          y:{title:{display:true, text:retentionCol}}
        }
      }
    });
    lines.push(`Regression scatter plotted: ${retentionCol} vs ${rainfallCol}${reg ? ` with fitted line (R² = ${reg.r2.toFixed(3)})` : ''}.`);
  }

  if(!lines.length) lines.push('No figures could be generated — check that the figure toggles are enabled and that Stage 1 data contains rainfall/outflow/retention columns.');
  outEl.textContent = lines.join('\n');
  showOutput(5);
}

function showOutput(stageIdx){
  const card = document.getElementById(`output-card-${stageIdx}`);
  if(card){ card.style.display='block'; card.scrollIntoView({behavior:'smooth',block:'nearest'}); }
}

function completeAndNext(idx){
  completedStages.add(idx);
  updateProgress();
  updateDots();
  if(idx < STAGES.length-1) goToStage(idx+1);
  else{
    const cc = document.getElementById('complete-card');
    if(cc) cc.style.display='block';
  }
}

function updateProgress(){
  const pct = Math.round((completedStages.size/STAGES.length)*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-label').textContent = `${completedStages.size} / ${STAGES.length}`;
}

function updateDots(){
  STAGES.forEach((s,i)=>{
    const dot = document.getElementById(`dot-${i}`);
    const lbl = document.getElementById(`slabel-${i}`);
    const line = document.getElementById(`line-${i}`);
    if(!dot) return;
    if(completedStages.has(i)){
      dot.classList.remove('active','new-badge');
      dot.classList.add('done');
      if(lbl){lbl.classList.add('done');}
      if(line){line.classList.add('done');}
    } else if(i===currentStage){
      dot.classList.add('active');
    } else {
      dot.classList.remove('active','done');
      if(s.isNew) dot.classList.add('new-badge');
    }
  });
}

buildSidebar();
buildContent();
goToStage(0);
updateDots();
</script>
</body>
</html>
